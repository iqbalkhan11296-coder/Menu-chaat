<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chaatarra | The House of Chaats</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<h1>CHAATARRA</h1>

<p>The House of Chaats</p>

<button id="cart-btn">
🛒 Cart (<span id="cart-count">0</span>)
</button>

</header>
<section class="hero">

    <div class="hero-content">

        <h2>Welcome to Chaatarra</h2>

        <p>The House of Chaats</p>

        <input
            type="text"
            id="search"
            placeholder="🔍 Search menu..."
            onkeyup="searchMenu()">

    </div>

</section>
    <section class="categories">

<button onclick="filterMenu('all')" class="active">
All
</button>

<button onclick="filterMenu('chaats')">
Chaats
</button>

<button onclick="filterMenu('coffee')">
Coffee
</button>

<button onclick="filterMenu('shakes')">
Shakes
</button>

<button onclick="filterMenu('combos')">
Combos
</button>

    </section>
<section class="menu">

<<div class="card chaats">

    <img src="images/pani-puri.jpg" alt="Pani Puri">

    <h2>Pani Puri</h2>

    <p class="description">
        Crispy puris served with spicy and tangy flavored water.
    </p>

    <h3>₹45</h3>

    <button onclick="addToCart('Pani Puri',45)">
        Add to Cart
    </button>

</div>
<div class="card">
<h2>Masala Puri</h2>
<p>₹55</p>
<button onclick="addToCart('Masala Puri',55)">Add to Cart</button>
</div>

<div class="card">
<h2>Samosa Chaat</h2>
<p>₹60</p>
<button onclick="addToCart('Samosa Chaat',60)">Add to Cart</button>
</div>

</section>

<!-- CART PANEL -->

<div id="cart-panel">

<div class="cart-header">

<h2>Your Cart</h2>

<button id="close-cart">✖</button>

</div>

<div id="cart-items">

<p>Your cart is empty.</p>

</div>

<div class="cart-footer">

<h3>Total : ₹<span id="cart-total">0</span></h3>

<button id="checkout-btn">

Proceed to Checkout

</button>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>

</body>
</html>
