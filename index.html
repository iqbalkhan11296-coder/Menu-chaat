<!DOCTYPE html>
<html lang="en">
<head>

    <title>Chaatarra | The House of Chaats</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CHAATARRA</h1>

</header>

<section class="menu">

    <div class="card">
        <h2>Pani Puri</h2>
        <p>₹45</p>
        <button onclick="addToCart('Pani Puri',45)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <h2>Masala Puri</h2>
        <p>₹55</p>
        <button onclick="addToCart('Masala Puri',55)">
            Add to Cart
        </button>
    </div>

    <div class="card">
        <h2>Samosa Chaat</h2>
        <p>₹60</p>
        <button onclick="addToCart('Samosa Chaat',60)">
            Add to Cart
        </button>
    </div>

</section>

<script src="script.js"></script>

</body>
</html>
